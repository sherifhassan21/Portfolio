name: Build and publish React portfolio

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/publish-react.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: react-app
      - name: Build site
        run: npm run build
        working-directory: react-app
      - name: Replace root static output
        run: |
          cp react-app/dist/index.html index.html
          rm -rf assets
          cp -R react-app/dist/assets assets
          cp -R react-app/dist/. ./
      - name: Commit compiled site for Cloudflare Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets '*.png' '*.svg'
          if git diff --cached --quiet; then
            echo "No website output changes"
          else
            git commit -m "Deploy React portfolio static output"
            git push origin HEAD:main
          fi
